[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-close-friends-windows"
version = "0.1.0b2"
description = "Windows-only Close Friends browser helper with CSV tracking and separate verification."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Project contributors"}]
dependencies = ["playwright>=1.57,<2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/BachYun/instagram-close-friends-windows"
Issues = "https://github.com/BachYun/instagram-close-friends-windows/issues"
Documentation = "https://github.com/BachYun/instagram-close-friends-windows#readme"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6.0.2,<7"]

[project.scripts]
close-friends-windows = "close_friends_csv:entrypoint"

[tool.setuptools]
py-modules = ["close_friends_csv", "cf_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: local mocked DOM integration; requires explicitly enabled Chromium"]
